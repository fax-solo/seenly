# JVM arguments for the Gradle daemon. Kept modest so builds coexist with other
# IDE/Gradle processes on memory-constrained machines.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Build performance. Parallelism is intentionally off to keep peak memory lower.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin.
kotlin.code.style=official

# JDK 17+ is required to build. Run the build with a JDK, e.g.:
#   JAVA_HOME=/usr/lib/jvm/java-17-openjdk ./gradlew assembleDebug
# (Arch: sudo pacman -S jdk17-openjdk)
# Alternatively pin the path here, but keep in mind this file is committed:
#org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
